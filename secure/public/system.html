<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System — Comunication_LTD Information System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand">Comunication_LTD</span>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="/change-password.html">Change password</a>
        <button id="logout" class="btn btn-outline-danger btn-sm">Log out</button>
      </div>
    </div>
  </nav>

  <main class="container" style="max-width: 720px;">
    <h1 class="h4 mb-4">Add a customer</h1>

    <div id="errors" class="alert alert-danger d-none" role="alert"></div>

    <form id="customer-form" class="row g-3 mb-4" novalidate>
      <div class="col-md-6">
        <label for="cust-name" class="form-label">Name</label>
        <input type="text" class="form-control" id="cust-name" required />
      </div>
      <div class="col-md-6">
        <label for="cust-email" class="form-label">Email</label>
        <input type="email" class="form-control" id="cust-email" />
      </div>
      <div class="col-md-4">
        <label for="cust-phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="cust-phone" />
      </div>
      <div class="col-md-4">
        <label for="cust-sector" class="form-label">Sector</label>
        <input type="text" class="form-control" id="cust-sector" />
      </div>
      <div class="col-md-4">
        <label for="cust-package" class="form-label">Package</label>
        <input type="text" class="form-control" id="cust-package" />
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Add customer</button>
      </div>
    </form>

    <div class="alert alert-success" role="status">
      Last customer added: <strong id="lastCustomer" class="ms-1"></strong>
    </div>

    <h2 class="h5 mt-4">Customers</h2>
    <ul id="customer-list" class="list-group mb-5"></ul>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/system.js"></script>
</body>
</html>
