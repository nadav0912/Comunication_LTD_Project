<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — Comunication_LTD Information System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-light">
  <main class="container" style="max-width: 480px;">
    <h1 class="h4 my-4">Forgot password</h1>

    <div id="errors" class="alert alert-danger d-none" role="alert"></div>
    <div id="success" class="alert alert-success d-none" role="alert"></div>

    <form id="forgot-form" novalidate>
      <div class="mb-3">
        <label for="fp-email" class="form-label">Account email</label>
        <input type="email" class="form-control" id="fp-email" required />
        <div class="form-text">We'll email a reset token if the account exists.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send reset token</button>
    </form>

    <p class="mt-3 mb-5 text-center">
      Have a token? <a href="/reset-password.html">Reset your password</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
