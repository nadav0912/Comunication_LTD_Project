<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Comunication_LTD Information System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-light">
  <main class="container" style="max-width: 480px;">
    <h1 class="h4 my-4">Create your account</h1>

    <div id="errors" class="alert alert-danger d-none" role="alert"></div>
    <div id="success" class="alert alert-success d-none" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required />
        <div class="form-text">Policy is enforced by the server.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="mt-3 mb-5 text-center">
      Already have an account? <a href="/index.html">Log in</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
