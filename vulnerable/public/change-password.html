<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change password — Comunication_LTD Information System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-light">
  <main class="container" style="max-width: 480px;">
    <h1 class="h4 my-4">Change password</h1>

    <div id="errors" class="alert alert-danger d-none" role="alert"></div>
    <div id="success" class="alert alert-success d-none" role="alert"></div>

    <form id="change-form" novalidate>
      <div class="mb-3">
        <label for="cp-current" class="form-label">Current password</label>
        <input type="password" class="form-control" id="cp-current" required />
      </div>
      <div class="mb-3">
        <label for="cp-new" class="form-label">New password</label>
        <input type="password" class="form-control" id="cp-new" required />
        <div class="form-text">Policy and history are enforced by the server.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Change password</button>
    </form>

    <p class="mt-3 mb-5 text-center"><a href="/system.html">Back to system</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
